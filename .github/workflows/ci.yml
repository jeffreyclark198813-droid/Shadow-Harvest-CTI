name: Shadow Harvest CTI - CI/CD pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-test:
    name: Code Validation & Unit Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-id: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Code Quality Auditing (Linter)
        run: npm run lint

      - name: Execute Automated Test Suites
        run: npm run test

  build-and-package:
    name: Build & Container Assembly
    needs: validate-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-id: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Production Bundle Compiler
        run: npm run build

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Dry Run Container Image Assembly
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: gcr.io/shadow-harvest-cti/api-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
